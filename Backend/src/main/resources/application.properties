spring.application.name=Maison de Renard
spring.config.import=optional:application-local.properties

# Server Configuration - Render's Docker web services inject a PORT env var
# and require the app to bind to it; falls back to 8080 for local dev and
# for hosts (like Railway) that don't set PORT.
server.port=${PORT:8080}

# PostgreSQL Configuration - override via DATABASE_URL/DATABASE_USERNAME/
# DATABASE_PASSWORD env vars in production (e.g. Railway/Render); defaults
# below are for local dev only.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/maison_de_renard}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:luka123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration - override JWT_SECRET in production; the fallback below
# is fine for local dev but should never be relied on once deployed.
jwt.secret=${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm-maison-de-renard-luxury-fashion-store}
jwt.expiration=86400000

# CORS - comma-separated list of allowed frontend origins, e.g.
# "http://localhost:3000,https://your-app.vercel.app". See
# JwtSecurityWebConfig.corsConfigurationSource().
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging
logging.level.com.example.maisonderenard=DEBUG
logging.level.org.springframework.security=DEBUG

anthropic.api.key=${ANTHROPIC_API_KEY:}